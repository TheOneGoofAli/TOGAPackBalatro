[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "play_sound('whoosh1', 0.4, 0.8)"
position = "before"
payload = "if togabalatro then togabalatro.execstartupsfx(change_context) end"
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if G.SETTINGS.skip_splash == 'Yes' then"
position = "before"
payload = "if togabalatro then togabalatro.postloadinit(true) end"
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self:splash_screen()"
position = "before"
payload = "self.toga_patch = true"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "check_for_unlock({type = 'run_card_replays'})"
position = "before"
payload = "if togabalatro then togabalatro.playextracards() end"
match_indent = true

[[patches]]
[patches.pattern]
target = 'main.lua'
pattern = "love.audio.stop()"
position = "after"
payload = "if togabalatro then togabalatro.errorhandler() end"
overwrite = true
match_indent = true

[[patches]]
[patches.regex]
target = 'main.lua'
pattern = "Oops! The game crashed"
position = "at"
payload = "A problem has been detected and Balatro has been stopped"
overwrite = true
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.E_MANAGER:add_event(Event({
	trigger = 'immediate',
	func = function()
		if #SMODS.drawn_cards > 0 then
			SMODS.calculate_context({first_hand_drawn = not G.GAME.current_round.any_hand_drawn and G.GAME.facing_blind,
									hand_drawn = G.GAME.facing_blind and SMODS.drawn_cards,
									other_drawn = not G.GAME.facing_blind and SMODS.drawn_cards})
			SMODS.drawn_cards = {}
			if G.GAME.facing_blind then G.GAME.current_round.any_hand_drawn = true end
		end
		return true
	end
}))
'''
position = "after"
payload = '''
G.E_MANAGER:add_event(Event({
	func = function()
		togabalatro.drawextracards()
		return true
	end
}))
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''
play_sound('highlight1', nil, 0.5)
play_sound('foil2', 0.5, 0.4)
'''
position = "after"
payload = "if togabalatro then togabalatro.achievementproc(_achievement, _type) end"
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.playing_card and not initial then check_for_unlock({type = 'modify_deck'}) end"
position = "after"
payload = "if togabalatro then check_for_unlock({ type = 'alloycheck_toga', card = self }) end"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "for k, v in ipairs(text) do"
position = "before"
payload = '''
if togabalatro and next(SMODS.find_card('j_toga_kappa')) then
	row[#row+1] = { n = G.UIT.R, config = { align = "cm" }, nodes = { { n = G.UIT.O, config = { object = SMODS.create_sprite(0, 0, 1, 1, 'toga_TOGAMoreIcons', { x = 8, y = 0 } ) } } } }
end
'''
match_indent = true

# Hi, Cryptid...
[[patches]]
[patches.pattern]
target = '=[SMODS Cryptid "lib/overrides.lua"]'
pattern = '''
function SMODS.four_fingers()
'''
position = "at"
payload = "function SMODS.four_fingers(...)"
overwrite = true
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS Cryptid "lib/overrides.lua"]'
pattern = '''
return smods_four_fingers() - Cryptid.get_paved_joker()
'''
position = "at"
payload = '''
-- TOGA's Stuff was here!
return smods_four_fingers(...) - Cryptid.get_paved_joker()
'''
overwrite = true
match_indent = true